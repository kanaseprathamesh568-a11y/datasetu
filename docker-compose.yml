version: "3.8"

services:
  datasetu:
    build:
      context: .
      dockerfile: Dockerfile
    image: datasetu:latest
    container_name: datasetu-engine
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional: Mount your own local folder of messy government datasets
      - ./demo:/app/demo:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
