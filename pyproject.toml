[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datasetu"
version = "1.0.0"
description = "Autonomous National Open Data to Open API Engine with Bharat Entity Intelligence"
readme = "README.md"
authors = [{ name = "Team DataSetu" }]
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pyarrow>=14.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "chardet>=5.2.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
    "watchfiles>=0.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0"
]

[project.scripts]
datasetu = "datasetu.cli:app"

[tool.setuptools.packages.find]
include = ["datasetu*"]
exclude = ["demo*", "scripts*", "tests*", "docs*"]

[tool.setuptools.package-data]
datasetu = ["data/*.json", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"

